name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build fat JAR
        run: ./mvnw package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/db-backup-cli-*.jar

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: db-backup-cli-linux
            binary-path: target/db-backup-cli
          - os: macos-latest
            artifact-name: db-backup-cli-macos
            binary-path: target/db-backup-cli
          - os: windows-latest
            artifact-name: db-backup-cli-windows.exe
            binary-path: target/db-backup-cli.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build native binary
        run: ./mvnw -Pnative package -DskipTests
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary-path }}

  release:
    needs: [jar, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
